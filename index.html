<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihil · الأوامر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0d;--surface:#131719;--line:#242b2e;--text:#e6ebec;--mute:#8a9598;--acc:#35d9a4;--accbg:#0f2a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6f6;--surface:#fff;--line:#d9e0e1;--text:#101516;--mute:#5d6a6d;--acc:#0b8a63;--accbg:#dff5ec}}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 12px;text-align:center}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.35em;padding-inline-start:.35em}
header p{margin:2px 0 0;color:var(--mute);font-size:13px;direction:ltr}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
input{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tabs button{flex:none;font:inherit;font-size:13px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
section{margin-top:22px}
h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between}
h2 span{font-weight:400}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.main{flex:none;font:inherit;font-weight:600;font-size:16px;direction:ltr;color:var(--acc);background:none;border:0;padding:4px 0;cursor:pointer;text-align:start}
.alts{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.alts button{font:inherit;font-size:12px;direction:ltr;color:var(--mute);background:none;border:1px solid var(--line);border-radius:6px;padding:0 7px;cursor:pointer}
.wa{flex:none;margin-inline-start:auto;font:inherit;font-size:12px;color:var(--text);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.cfg{margin-top:36px;font-size:13px;color:var(--mute)}
.cfg input{margin-top:6px;direction:ltr}
#toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--acc);color:#04140e;font-weight:600;border-radius:99px;padding:6px 18px;opacity:0;transition:opacity .2s;pointer-events:none;direction:ltr}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header><h1>NIHIL</h1><p>a quiet kind of power.</p></header>
<div class="bar">
<input id="q" type="search" placeholder="ابحث عن أمر…" autocomplete="off" aria-label="بحث">
<div class="tabs" id="tabs"></div>
</div>
<main id="list"></main>
<div class="cfg"><label for="num">رقم البوت (اختياري) — لو كتبته الزرار يفتح شات البوت والأمر جاهز</label>
<input id="num" inputmode="tel" placeholder="201xxxxxxxxx"></div>
</div>
<div id="toast" role="status"></div>
<script>

.ايديت",".إيديت",".اديت",".edit"],[".ocr",".readimg"],[".translatemoroccan",".tm",".ترجم_المغربي",".ترجم_مغربي",".ترجم"]]},{"n":"Events & Games","a":"الفعاليات والألعاب","c":[[".box",".ملاكمة"],[".challenge",".ch"],[".dealer",".dl"],[".shoot",".use",".items"],[".farm",".fm"],[".guess",".gs"],[".رعب",".horror",".فتش",".حقق",".اتهم",".ادلة"],[".صوت",".vote"],[".evset",".اعدادات_الفعاليات",".عملة",".جوائز"],[".اتهام",".accuse",".تخمين",".guess"],[".تحدي",".تحدي_البوت",".vs",".vsbot"],[".writing",".wr"],[".قفل_الفعاليات",".فتح_الفعاليات",".حالة_الفعاليات",".evlock"],[".evmgr",".evmanager"],[".games",".فعاليات"],[".ev",".zg"],[".منيو_التحدي",".vsmenu",".vb"]]}];
let tab=-1;
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$('#num').value=store.get('nihil_num');
$('#num').addEventListener('input',e=>store.set('nihil_num',e.target.value.replace(/\D/g,'')));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1400)}
async function copy(c){
 try{await navigator.clipboard.writeText(c)}catch(e){const a=document.createElement('textarea');a.value=c;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 toast('اتنسخ '+c)}
function wa(c){const n=store.get('nihil_num');location.href=(n?'https://wa.me/'+n:'https://wa.me/')+'?text='+encodeURIComponent(c)}
function render(){
 const q=$('#q').value.trim().toLowerCase();const out=[];
 DATA.forEach((s,i)=>{if(tab>=0&&tab!==i)return;
  const rows=s.c.filter(a=>!q||a.some(x=>x.toLowerCase().includes(q)));
  if(!rows.length)return;
  out.push('<section><h2>'+s.a+'<span dir="ltr">'+s.n+'</span></h2>'+rows.map(a=>'<div class="row"><button class="main" data-c="'+a[0]+'">'+a[0]+'</button><div class="alts">'+a.slice(1).map(x=>'<button data-c="'+x+'">'+x+'</button>').join('')+'</div><button class="wa" data-w="'+a[0]+'">واتساب</button></div>').join('')+'</section>')});
 $('#list').innerHTML=out.join('')||'<p class="empty">مفيش أمر بالاسم ده. جرّب كلمة تانية.</p>'}
$('#tabs').innerHTML='<button aria-pressed="true" data-t="-1">الكل</button>'+DATA.map((s,i)=>'<button aria-pressed="false" data-t="'+i+'">'+s.a+'</button>').join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=+b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)copy(b.dataset.c);else if(b.dataset.w)wa(b.dataset.w)});
$('#q').addEventListener('input',render);
render();
</script>
</body>
</html>
